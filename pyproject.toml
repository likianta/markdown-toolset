[project]
name = "markdown-toolset"
version = "0.1.0"
description = ""
authors = [{ name = "Likianta", email = "likianta@foxmail.com" }]
# readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argsense>=3.0.1a0",
    "lk-utils>=3.8.3a0",
    "markdown2>=2.5.5",
    "neoprint>=1.0.0b0",
    "pillow>=12.2.0",
    "pyapp-window>=2.3.0",
    "pyfiglet>=1.0.4",
    "pyperclip>=1.9.0",
    "streamlit>=1.65.0",
    "streamlit-canary>=0.5.1b0",
]

[tool.uv.sources]
argsense = { index = "likianta" }
lk-utils = { index = "likianta" }
neoprint = { index = "likianta" }
pyapp-window = { index = "likianta" }
streamlit-canary = { index = "likianta" }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# [project.optional-dependencies]
# ...

# [project.scripts]
# ...

# [project.urls]
# homepage = "..."

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
# force-single-line = true
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pycodestyle]
max-line-length = 83

# [tool.ty.environment]
# extra-paths = ["./lib"]

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "likianta"
url = "http://localhost:2131/"
explicit = true
