[project]
name = "markdown-toolset"
version = "0.1.0"
description = ""
# readme = "README.md"
authors = [{ name = "Likianta", email = "likianta@foxmail.com" }]
packages = [{ include = "src" }]
requires-python = ">=3.14"
dynamic = ["dependencies"]
# license = "MIT"

[tool.poetry.dependencies]
python = "^3.14"
argsense = { version = "^1.1.1", source = "likianta" }
lk-utils = { version = "^3.6.0a13", source = "likianta" }
markdown2 = "^2.5.5"
pillow = "^12.2.0"
pyapp-window = { version = "^2.2.1", source = "likianta" }
pyperclip = "^1.9.0"
qmlease = { version = "^4.0.0a5", source = "likianta", extras = ["ui"] }
streamlit = "^1.56.0"
streamlit-canary = { version = "^0.2.2b1", source = "likianta" }

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

[[tool.poetry.source]]
name = "likianta"
url = "http://localhost:2191/"
priority = "supplemental"

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"

[tool.ty.rules]
invalid-type-form = "ignore"
unresolved-attribute = "ignore"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
