[project]
name = "markdown-toolset"
version = "0.1.0"
description = ""
authors = [{ name = "Likianta", email = "likianta@foxmail.com" }]
# readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argsense>=1.1.2",
    "lk-utils>=3.7.0b2",
    "markdown2>=2.5.5",
    "pillow>=12.2.0",
    "pyapp-window>=2.2.3",
    "pyperclip>=1.9.0",
    # "qmlease[ui]>=4.0.0a6",
    "streamlit-canary>=0.3.0",
    "streamlit>=1.56.0",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# [dependency-groups]
# dev = []
# [project.optional-dependencies]
# ...

# [project.scripts]
# ...

# [project.urls]
# homepage = "..."

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true

# [tool.ruff.lint]
# extend-select = ["E501"]  # line too long
# extend-select = ["I001", "E501"]

[tool.ruff.lint.isort]
force-single-line = true
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pycodestyle]
max-line-length = 83

# [tool.ty.environment]
# extra-paths = ["./lib"]

# [tool.ty.rules]
# invalid-type-form = "ignore"
# unresolved-attribute = "ignore"

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[[tool.uv.index]]
name = "likianta"
url = "http://localhost:2191/"
# explicit = true

[tool.uv.sources]
argsense = { index = "likianta" }
lk-utils = { index = "likianta" }
pyapp-window = { index = "likianta" }
qmlease = { index = "likianta" }
streamlit-canary = { index = "likianta" }
